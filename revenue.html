<script>

    c.T.forEach(function(t){prods[t[0]]={label:t[1],children:[],own:t[3]?ser(t[3]):null};});
    c.T.forEach(function(t){if(t[2]>=0)prods[codes[t[2]]].children.push(t[0]);});
    function val(k){var n=prods[k];if(!n.vals)n.vals=n.own||add(n.children.map(val));return n.vals;}
    var products={};codes.forEach(function(k){var n=prods[k],x=val(k);products[k]={label:n.label,children:n.children,v:x.v,p:x.p};});
    var countries={};
    c.C.forEach(function(r){
      var fam={},fl=[];r[2].forEach(function(f){var x=ser(f[1]);fam[c.F[f[0]]]=x;fl.push(x);});
      var tot=r[4]?ser(r[4]):add(fl);
      var subs=r[3].map(function(s){var x=s.length<3?tot:(s[2]===0?add([]):ser(s[2]));return {n:s[1],m:s[0],v:x.v,p:x.p};});
      countries[r[0]]={name:r[1],v:tot.v,p:tot.p,fam:fam,subs:subs};
    });
    var d={entity:c.e,scenario:c.s,account:c.a,region:c.r,year:c.y,pyear:c.py,months:m,root:c.root,mapDiv:c.root,products:products,countries:countries};
    if(c.t){var t=ser(c.t[1]);d.tile={label:c.t[0],v:t.v,p:t.p};}
    if(c.mg){d.margins={};c.mg.forEach(function(g){var v=g[2].map(function(x){return x/1e4;});while(v.length<12)v.push(0);d.margins[g[0]]={label:g[1],v:v,p:g[3].map(function(x){return x/1e4;})};});}
    return d;
  }

  if(e){try{msg(new TextDecoder().decode(b(e)));}catch(x){msg('Error');}return;}
  if(!k&&!z){msg('No data. Open this page from the OneStream dashboard (Revenue Analysis).');return;}
  var pieces={1:z},done=false;
  function draw(){
    if(done)return;for(var i=1;i<=n;i++)if(pieces[i]==null)return;done=true;
    var all='';for(var j=1;j<=n;j++)all+=pieces[j];
    new Response(new Blob([b(all)]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      .then(function(s){JSON.parse(s);run(s);})
      .catch(function(x){msg('Could not read the data: '+(x&&x.message||x));});
  }
  function take(part,piece){if(part>1&&part<=n&&pieces[part]==null){pieces[part]=piece||'';draw();}}
  addEventListener('message',function(ev){var d=ev.data;if(d&&d.osw&&d.t==='part'&&d.key===k)take(+d.part,d.z);});
  if(bc)bc.onmessage=function(ev){var d=ev.data;if(d&&d.t==='part')take(+d.part,d.z);};
  if(n>1)msg('Loading the revenue data from OneStream…');
  draw();
  var tries=0,iv2=setInterval(function(){
    if(done){clearInterval(iv2);return;}
    for(var i=2;i<=n;i++){try{var v=localStorage.getItem('osw:'+k+':'+i);if(v!=null)take(i,v);}catch(x){}}
    if(tries%3===0){var need={osw:1,t:'need',key:k};postAll(need);if(bc)try{bc.postMessage(need);}catch(x){}}
    if(++tries>40){clearInterval(iv2);if(!done){var miss=[];for(var j=2;j<=n;j++)if(pieces[j]==null)miss.push(j);msg('Waiting for helper panel(s) '+miss.join(', ')+' timed out. Refresh the dashboard; if it repeats, check the helper Web Content components are on the dashboard.');}}
  },250);
})();
</script>
